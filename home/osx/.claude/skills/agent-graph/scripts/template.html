<title>__TITLE__</title>

      --ink-2: #c3c2b7;

    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --line: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --band: rgba(11, 11, 11, 0.028);
    --shadow: 0 8px 28px rgba(11, 11, 11, 0.14);
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --line: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --band: rgba(255, 255, 255, 0.035);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  header.page {
    max-width: 1500px; margin: 0 auto; padding: 36px 28px 8px;
    display: flex; align-items: flex-start; gap: 16px;
  }
  header.page .head-text { flex: 1 1 auto; min-width: 0; }
  header.page .head-actions { flex: 0 0 auto; display: flex; gap: 8px; }
  #themeToggle {
    flex: 0 0 auto; border: 1px solid var(--border);
    background: none; color: var(--ink-2); border-radius: 7px; height: 28px;
    cursor: pointer; font-size: 14px; line-height: 1; width: 28px;
  }
  #themeToggle:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  h1 {
    margin: 0 0 6px; font-size: 27px; font-weight: 750; letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .sub { color: var(--ink-2); max-width: 72ch; margin: 0; }
  .sub .mono { font-size: 12.5px; color: var(--muted); }

  .stats {
    display: flex; flex-wrap: wrap; gap: 10px;
    max-width: 1500px; margin: 18px auto 0; padding: 0 28px;
  }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;

  .legend {
    display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-start;

  .sel-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }

  .band-label {
    position: absolute; font-size: 10px; font-weight: 700; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--muted); pointer-events: none; white-space: nowrap;
  }
  .axis-tick {
    position: absolute; font-size: 9px; line-height: 1; color: var(--muted);
    pointer-events: none; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  }

  .node {
    position: absolute; padding: 4px 8px 3px; cursor: pointer;
    display: flex; flex-direction: column; gap: 0; overflow: visible;
  }
  .node .t {
    font-size: 12px; font-weight: 650; line-height: 1.25; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    flex-shrink: 0;
  }
  .node.tight .t { font-size: 11.5px; }
  /* .m sets overflow:hidden for its ellipsis truncation, which under flexbox
     gives it an "automatic minimum size" of 0 — so instead of the node's flex
     column overflowing (which scrollHeight could then detect and grow from),
     the flex algorithm silently SHRINKS it below its own natural text height
     when space is tight, clipping its glyphs while scrollHeight still reports
     the constrained (fitting) height. Pin it to its natural size so a genuine
     shortfall shows up as real overflow instead of an invisible squeeze. */
  .node .m { flex-shrink: 0; }
  /* Node content is EXACTLY three rows: title, one meta line, tool-tick strip.
     The meta line therefore never wraps — nodes are wide enough that
     branch · duration · churn · tokens fits; a rare overlong branch name
     ellipsizes rather than adding a fourth row and inflating every node. */
  .node .m {
    font-size: 10.5px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .node .m b { color: var(--nc); font-weight: 650; }
  .node .m .br { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  /* row 3: the tool-tick strip pinned to the node's bottom edge. */
  .node .toolrow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 11px;
    overflow: hidden; pointer-events: none;
  }
  .node .toolrow .tburst {
    position: absolute; bottom: 1px; width: 7px; height: 7px; pointer-events: auto;
  }

  .node .tburst.cat-edit { background: #2a9d8f; }
  .node .tburst.cat-read { background: #457b9d; }
  .node .tburst.cat-bash { background: #e9c46a; }
  .node .tburst.cat-spawn { background: var(--nc); }
  .node .tburst.cat-skill { background: #9b5de5; }
  .node .tburst.cat-other { background: var(--muted); }
  .ev-row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 0;

  .ev-dot.cat-bash { background: #e9c46a; }

  .ev-time { color: var(--muted); font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; font-size: 11px; flex: 0 0 auto; }

  }

  .ev-lines { color: var(--muted); flex: 0 0 auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  .ev-timeline { max-height: 280px; overflow: auto; margin-top: 4px; }
  /* inline inside the meta row (row 2), not a row of its own */
  .node .badge {
    display: inline-block; font-size: 9.5px; font-weight: 700;

  .marker-label {

  .marker-label.row {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; pointer-events: auto;

<script>
/* Applied before render to avoid a flash of the wrong theme. */
(function () {
  var KEY = 'agentgraph:theme';
  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) { /* file:// may throw */ }
  if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
  else try { localStorage.removeItem(KEY); } catch (e) {}
})();
</script>

<script>
/* ------------------------------------------------------- theme toggle --- */
(function () {
  var KEY = 'agentgraph:theme';
  var STATES = ['auto', 'light', 'dark'];
  var GLYPH = { auto: '◐', light: '☀', dark: '☾' };
  var LABEL = {
    auto: 'Theme: auto (follow system) — click for light',
    light: 'Theme: light — click for dark',
    dark: 'Theme: dark — click for auto',
  };
  var btn = document.getElementById('themeToggle');
  var current = document.documentElement.dataset.theme;
  if (STATES.indexOf(current) < 1) current = 'auto';

  function apply(state) {
    current = state;
    if (state === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = state;
    btn.textContent = GLYPH[state];
    btn.title = LABEL[state];
    btn.setAttribute('aria-label', LABEL[state]);
    try {
      if (state === 'auto') localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, state);
    } catch (e) { /* file:// may throw */ }
  }

  btn.addEventListener('click', function () {
    apply(STATES[(STATES.indexOf(current) + 1) % STATES.length]);
  });
  apply(current);
})();
</script>

<script>
'use strict';

/* ---------------------------------------------------------------- data --- */

const SESSIONS_DIR = "__SESSIONS_DIR__";
const DYNAMIC_MODE = __DYNAMIC_MODE__;

let DATA = __DATA_JSON__;

// Dynamic loading mode: fetch sessions from directory
async function loadDynamicSessions() {
  if (!DYNAMIC_MODE || !SESSIONS_DIR) return DATA;

  try {
    const indexResp = await fetch(`${SESSIONS_DIR}/index.json`);
    if (!indexResp.ok) throw new Error(`Failed to load index: ${indexResp.status}`);
    const index = await indexResp.json();

    const agents = [];
    const markers = [];
    const loadedSessions = [];

    for (const session of index.sessions) {
      try {
        const ndjsonResp = await fetch(`${SESSIONS_DIR}/${session.id}.ndjson`);
        if (!ndjsonResp.ok) continue;
        const ndjsonText = await ndjsonResp.text();
        const sessionData = JSON.parse(ndjsonText.split('\n')[0]);
        agents.push(...(sessionData.agents || []));
        markers.push(...(sessionData.markers || []));
        loadedSessions.push(sessionData);
      } catch (e) {
        console.error(`Failed to load session ${session.id}:`, e);
      }
    }

    return {
      draft: false,
      multiSession: loadedSessions.length > 1,
      sessions: loadedSessions,
      title: `Agent graph (${loadedSessions.length} sessions)`,
      eyebrow: 'multi-session view',
      subtitle: '',
      footer: '',
      agents,
      markers,
    };
  } catch (e) {
    console.error('Failed to load dynamic sessions:', e);
    return DATA;
  }
}

// Ensure data is loaded before initialization
(async () => {
  if (DYNAMIC_MODE) {
    DATA = await loadDynamicSessions();
  }
  // Fall through to initialization code below
})().catch(e => console.error('Initialization error:', e));



async function initializeGraph() {
  /* validated categorical palette (dataviz, CVD-checked, both themes) */
  const LIGHT = ['#4a3aa7', '#1baf7a', '#2a78d6', '#eda100', '#e87ba4', '#008300', '#eb6834', '#e34948'];
  const DARK  = ['#9085e9', '#199e70', '#3987e5', '#c98500', '#d55181', '#008300', '#d95926', '#e66767'];
  
  const WORK_LABEL = {
    orchestration: 'orchestration', implementation: 'implementation',
    testing: 'testing / gates', docs: 'docs', research: 'research',
  };
  
  /* normalise agents (defensive defaults for optional fields) */
  const AGENTS = DATA.agents.map((a) => ({
    respawnOf: null, parentGuessed: false, model: null, skills: [], status: 'ok',
    work: 'implementation', branch: '', events: [],
    ...a,
    branch: typeof a.branch === 'string' ? a.branch : '',
    events: Array.isArray(a.events) ? a.events : [],
    counts: { edits: 0, bash: 0, reads: 0, spawns: 0, ...(a.counts || {}) },
    diff: { added: 0, removed: 0, files: 0, ...(a.diff || {}) },
    tokens: { in: 0, out: 0, cacheRead: 0, cacheCreate: 0, ...(a.tokens || {}) },
    skills: Array.isArray(a.skills) ? a.skills : [],
  }));
  const MARKERS = Array.isArray(DATA.markers) ? DATA.markers.slice() : [];
  
  const byId = Object.fromEntries(AGENTS.map((a) => [a.id, a]));

  /* ROOTS, not root. A single-session graph has exactly one parentless agent
     (its main thread), but an aggregated multi-session graph flattens N
     sessions into one AGENTS array and so legitimately has N parentless mains
     — one per session. Every one of them is a real root: it owns its own
     session's coordinators and its own y/x extent.

     `root` is ONLY the PRIMARY root (earliest-starting), and is used purely
     for board-level chrome that needs a single representative: the palette
     seed and the colour of the spine/marker glyphs (every main shares
     type 'main', so the choice is cosmetic and stable). Anything STRUCTURAL —
     "is this agent a root?", "is this agent's parent a root?" — must go via
     isRoot()/byId[a.parent], never `=== root`, or it silently attributes every
     session's children to one arbitrary session's main thread. */
  const ROOTS = AGENTS.filter((a) => a.parent == null);
  if (!ROOTS.length && AGENTS.length) ROOTS.push(AGENTS[0]);
  const ROOT_IDS = new Set(ROOTS.map((a) => a.id));
  const isRoot = (a) => !!a && ROOT_IDS.has(a.id);
  ROOTS.sort((x, y) => T(x.start) - T(y.start));
  const root = ROOTS[0];
  
  /* ------------------------------------------------------------- colours --- */
  
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
  const typeOrder = [];
  const pushType = (t) => { if (!typeOrder.includes(t)) typeOrder.push(t); };
  pushType(root.type);
  AGENTS.forEach((a) => pushType(a.type));
  
  function cssVars(arr) {
    return typeOrder.map((t, i) => `--c-${slug(t)}:${arr[i % arr.length]};`).join('');
  }
  const styleEl = document.createElement('style');
  styleEl.textContent = [
    `:root{${cssVars(LIGHT)}}`,
    `@media (prefers-color-scheme:dark){:root{${cssVars(DARK)}}}`,
    `:root[data-theme="dark"]{${cssVars(DARK)}}`,
    `:root[data-theme="light"]{${cssVars(LIGHT)}}`,
  ].join('\n');
  document.head.appendChild(styleEl);
  const cvar = (t) => `var(--c-${slug(t)})`;
  
  /* ------------------------------------------------------- structure/tree --- */
  
  /* a coordinator is a child of ANY root (i.e. any session's main thread) */
  const coordinators = AGENTS.filter((a) => a.parent != null && ROOT_IDS.has(a.parent))
    .sort((x, y) => T(x.start) - T(y.start));
  const coordSet = new Set(coordinators.map((c) => c.id));
  
  /* nearest coordinator ancestor + depth from root (root=0, coord=1, worker=2, …) */
  function ancestorCoord(a) {
    let cur = a, guard = 0;
    while (cur && guard++ < 40) {
      if (coordSet.has(cur.id)) return cur.id;
      if (cur.parent == null) return null;
      cur = byId[cur.parent];
    }
    return null;
  }
  function depthOf(a) {
    let d = 0, cur = a, guard = 0;
    while (cur && cur.parent != null && guard++ < 40) { d++; cur = byId[cur.parent]; }
    return d;
  }
  function evCat(tool) {
    if (EDIT_TOOLS.has(tool)) return 'edit';
    if (tool === 'Read') return 'read';
    if (tool === 'Bash') return 'bash';
    if (tool === 'Agent' || tool === 'Task') return 'spawn';
    if (tool === 'Skill') return 'skill';
    return 'other';
  }
  const EDIT_TOOLS = new Set(['Edit', 'Write', 'NotebookEdit', 'MultiEdit']);
  /* one tick per tool call, placed at its TRUE relative time within the agent's
     own [t0,t1] span. Capped at TOOL_TICK_CAP ticks; overflow collapses into a
     single trailing "+N" sentinel tick. frac is a 0..1 fraction of the node's
     own span (NOT the global time scale), so ticks map onto the existing bar
     and reposition correctly if the node box later grows. Returns
     [{frac,cat,title}] (+ optional {overflow:N} sentinel). */
  const TOOL_TICK_CAP = 24;
  function toolTicks(a) {
    const evs = a.events;
    if (!evs || !evs.length) return [];
    const sorted = evs.slice().sort((x, y) => T(x.t) - T(y.t));
    /* always the node's WIDTH: the strip is a bottom row. */
    const boxDim = Math.max(20, a.w || 20);
    /* spread ticks across the WHOLE node box by their position in the agent's
       own time span (frac of [t0,t1]). This fills the box even for short
       coordinators whose drawn height is MIN_H-inflated above their true time
       span (raw yOf-based offsets would bunch them in the top time-band). When
       the box height equals the time span — the common case for long
       coordinators with distinct spawn/return waves — frac maps 1:1 onto the
       timeline, so a call between the last return and the next launch lines up
       with that gap. */
    const span = Math.max(1, a.t1 - a.t0);
    const shown = sorted.slice(0, TOOL_TICK_CAP);
    const ticks = shown.map((ev) => {
      const frac = Math.max(0, Math.min(1, (T(ev.t) - a.t0) / span));
      const off = Math.max(0, Math.min(boxDim, frac * boxDim));
      const cat = evCat(ev.tool);
      const tgt = ev.target ? String(ev.target) : '';
      const tgtShort = tgt.length > 48 ? tgt.slice(0, 47) + '…' : tgt;
      const title = `${fmtT(T(ev.t))} · ${ev.tool}${tgtShort ? ' · ' + tgtShort : ''}`;
      return { off, cat, title };
    });
    if (sorted.length > TOOL_TICK_CAP) {
      const lastOff = ticks.length ? ticks[ticks.length - 1].off : boxDim - 6;
      ticks.push({ off: Math.min(boxDim - 6, lastOff), cat: 'other', overflow: sorted.length - TOOL_TICK_CAP });
    }
    return ticks;
  }
  AGENTS.forEach((a) => { a.depth = depthOf(a); a.coord = isRoot(a) || coordSet.has(a.id) ? null : ancestorCoord(a); });
  const workers = AGENTS.filter((a) => !isRoot(a) && !coordSet.has(a.id));
  
  /* groups: arrays of coordinator ids. default = one group holding every coordinator */
  let GROUPS = (Array.isArray(DATA.groups) && DATA.groups.length)
    ? DATA.groups.map((g) => g.filter((id) => coordSet.has(id)))
    : [coordinators.map((c) => c.id)];
  GROUPS = GROUPS.filter((g) => g.length);
  /* any coordinator not placed by DATA.groups → append to a trailing group */
  const placed = new Set(GROUPS.flat());
  const leftovers = coordinators.filter((c) => !placed.has(c.id)).map((c) => c.id);
  if (leftovers.length) GROUPS.push(leftovers);
  if (!GROUPS.length) GROUPS = [[]];
  const groupIndexOfCoord = {};
  GROUPS.forEach((g, gi) => g.forEach((id) => { groupIndexOfCoord[id] = gi; }));
  const groupIndexOf = (a) => isRoot(a) ? -1
    : coordSet.has(a.id) ? groupIndexOfCoord[a.id]
    : (a.coord != null ? groupIndexOfCoord[a.coord] : 0) ?? 0;
  
  /* ---------------------------------------------------------- shared/time --- */
  
  function T(s) { return new Date(s).getTime(); }
  const MIN = 60000;
  AGENTS.forEach((a) => { a.t0 = T(a.start); a.t1 = T(a.end); if (!(a.t1 > a.t0)) a.t1 = a.t0 + 30000; });
  
  /* escape for BOTH text nodes and attribute values — the double-quote escape is
     load-bearing: node/band titles are user prompts that routinely contain " , and
     an unescaped one closes a title="…" attribute early and lets the rest of the
     board's HTML nest inside that one node. */
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fmtT = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const fmtDur = (ms) => {
    const m = Math.round(ms / MIN);
    if (m < 1) return `${Math.round(ms / 1000)}s`;
    return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
  };
  const fmtTokens = (n) => {
    n = n || 0;
    if (n < 1000) return `${n}`;
    if (n < 1e6) return `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k`;
    return `${(n / 1e6).toFixed(2).replace(/\.0+$/, '')}M`;
  };
  const workLabel = (w) => WORK_LABEL[w] || w;
  
  /* work-type silhouettes */
  function shapePath(work, x, y, w, h) {
    if (work === 'testing') {
      const c = 10;
      return `M${x + c},${y} H${x + w - c} L${x + w},${y + c} V${y + h - c} L${x + w - c},${y + h} H${x + c} L${x},${y + h - c} V${y + c} Z`;
    }
    if (work === 'docs') {
      const f = 14, r = 8;
      return `M${x + r},${y} H${x + w - f} L${x + w},${y + f} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + r} Q${x},${y} ${x + r},${y} Z`;
    }
    if (work === 'orchestration') {
      const v = 9;
      return `M${x},${y + v} L${x + w / 2},${y} L${x + w},${y + v} V${y + h - v} L${x + w / 2},${y + h} L${x},${y + h - v} Z`;
    }
    const r = 9; // implementation / research / default: rounded rect
    return `M${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + r} Q${x},${y} ${x + r},${y} Z`;
  }
  
  const STATUS_BADGE = { cutoff: '✕ usage limit', dropped: '✕ connection lost', fault: '✕ harness fault' };
  
  const svgParts = [];
  const htmlParts = [];
  let BOARD_W = 0, BOARD_H = 0;
  let boardScale = 1;   // current visual board scale, set by paint() from zoomScale()

  /* ------------------------------------------------------ viewport culling --- */
  /* Board coordinate space is 1:1 with CSS pixels (the SVG's viewBox is exactly
     BOARD_W x BOARD_H, matching the width/height attrs and the #board div's own
     px size). `.board-scroll` only has `overflow-x: auto` (see CSS above) — it
     is NOT the vertical scroll container, the page itself is: the board just
     grows tall and the document/body scrolls. So the x-range of what's visible
     comes from `.board-scroll`'s own scrollLeft/clientWidth, but the y-range has
     to come from the #board element's position relative to the viewport
     (getBoundingClientRect) combined with the window's viewport height. This
     mapping is robust to native ctrl+scroll page zoom too, since
     getBoundingClientRect/clientWidth/innerHeight are all reported in the
     already-zoomed CSS pixel space. CULL_MARGIN_MULT is the overscan, in
     multiples of the viewport's own width/height, kept generous so scrolling
     never shows visible pop-in and small graphs (which fit inside one
     viewport+margin) render identically to the pre-culling behaviour. */
  const CULL_MARGIN_MULT = 1.5;
  function getViewportRect() {
    const bs = document.querySelector('.board-scroll');
    const boardEl = document.getElementById('board');
    if (!bs || !boardEl) return null;
    const vw = bs.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (!vw || !vh) return null;
    const boardTop = boardEl.getBoundingClientRect().top;   // px from viewport top; <=0 once scrolled past
    const mx = vw * CULL_MARGIN_MULT, my = vh * CULL_MARGIN_MULT;
    const y0 = -boardTop, y1 = y0 + vh;
    /* scrollLeft/clientWidth/getBoundingClientRect are all in screen (scaled)
       px, but node geometry (a.x0/a.y0/a.w/a.h) lives in the board's own
       logical (unscaled) coordinate space — the board is painted at full
       resolution and shrunk visually via CSS transform (see paint()). Divide
       through by the current board scale to bring the rect back into that
       same logical space before comparing against node boxes. */
    const zs = boardScale || 1;
    return {
      x0: (bs.scrollLeft - mx) / zs, y0: (y0 - my) / zs,
      x1: (bs.scrollLeft + vw + mx) / zs, y1: (y1 + my) / zs,
    };
  }
  function nodeInRect(a, r) {
    if (!r) return true;
    return a.x0 + a.w >= r.x0 && a.x0 <= r.x1 && a.y0 + a.h >= r.y0 && a.y0 <= r.y1;
  }

  svgParts.push(`<defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--muted)" stroke-width="1.6" opacity="0.45"/>
    </pattern>
    <pattern id="breakhatch" width="9" height="9" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="var(--line)" stroke-width="1.4" opacity="0.6"/>
    </pattern>
    ${typeOrder.map((t) => `
    <marker id="arr-${slug(t)}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="${cvar(t)}"/>
    </marker>
    <marker id="dot-${slug(t)}" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5">
      <circle cx="3" cy="3" r="2.6" fill="${cvar(t)}"/>
    </marker>`).join('')}
    <marker id="arr-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="var(--muted)"/>
    </marker>
  </defs>`);
  
  /* render an edges[] array (dispatch/return/respawn descriptors) as <path>
     elements. respawnLabelOffset nudges the "⟳ respawn" text clear of its curve. */
  function pushEdges(edges, respawnLabelOffset) {
    const [rlx, rly] = respawnLabelOffset || [8, 30];
    for (const e of edges) {
      svgParts.push(`<path class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${e.d}" fill="none"
        stroke="${e.stroke}" stroke-width="${e.w}" stroke-opacity="${e.op}"
        ${e.dash ? `stroke-dasharray="${e.dash}"` : ''}
        ${e.atStart ? `marker-start="url(#${e.marker})"` : `marker-end="url(#${e.marker})"`}/>`);
      if (e.respawn) {
        /* accepts a straight L(ine), a C(urve) arc, or an elbow polyline whose
           first command after the move is V or H */
        const mid = e.d.match(/M([\d.]+),([\d.]+) [CLVH]/);
        if (mid) svgParts.push(`<text x="${+mid[1] + rlx}" y="${+mid[2] + rly}" font-size="10" fill="var(--muted)">⟳ respawn</text>`);
      }
    }
  }
  
  /* ROW 2 of the fixed three-row node: git branch · duration · LOC churn ·
     tokens, plus the status badge inline at the end for non-ok agents. Missing
     pieces are simply omitted (never rendered as an empty segment), and the
     whole thing is always a SINGLE .m span so node height stays exactly three
     rows. The agent TYPE is deliberately absent — it's already encoded by the
     node's colour and spelled out in the drawer. */
  function metaLine(a) {
    const d = a.diff, tk = a.tokens.in + a.tokens.out + a.tokens.cacheRead;
    const parts = [];
    if (a.branch) parts.push(`<span class="br">⎇ ${esc(a.branch)}</span>`);
    parts.push(`<span class="mono">${fmtDur(a.t1 - a.t0)}</span>`);
    if (d.added || d.removed) parts.push(`<span class="mono"><b>+${d.added}</b> −${d.removed}</span>`);
    if (tk) parts.push(`<span class="mono">${fmtTokens(tk)} tok</span>`);
    if (a.status !== 'ok') parts.push(`<span class="badge">${STATUS_BADGE[a.status] || '✕ ' + esc(a.status)}</span>`);
    return `<span class="m">${parts.join(' · ')}</span>`;
  }

  /* paint one agent block — surface backing, tinted/hatched shape, and the
     overlaid HTML node (title/meta/skills). */
  /* uniform rounded-rectangle for EVERY node — the redesign drops shape-as-signal
     (kind is conveyed by fill/border colour + labels only). */
  function rectPath(x, y, w, h) {
    const r = 9;
    return `M${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + r} Q${x},${y} ${x + r},${y} Z`;
  }
  /* zoom-level node rendering, layered ON TOP of the existing viewport
     culling below (paintNode is only called for nodes that already passed
     nodeInRect) — 'regular' is the full render; 'more' and 'all' are
     progressively cheaper/simpler renders selected by the zoom control
     (selZoom). This is independent of the board-level visual zoom-out
     (see zoomScale()) — cheaper per-node rendering is still worth it at
     scale even though the board is also shrunk visually. */
  function paintNode(a, x, y, w, h, pad, tight) {
    if (selZoom === 'all') return paintNodeMinimal(a, x, y, w, h);
    if (selZoom === 'more') return paintNodeSimple(a, x, y, w, h, pad, tight);
    return paintNodeFull(a, x, y, w, h, pad, tight);
  }
  /* zoom "all" — every session/day at once: bare rect + native <title> tooltip,
     no HTML text composite at all (the expensive part at 1000+ agents). */
  function paintNodeMinimal(a, x, y, w, h) {
    svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}"
      fill="${cvar(a.type)}" fill-opacity="${a.parent == null ? 0.4 : 0.28}" stroke="${cvar(a.type)}" stroke-width="${a.parent == null ? 2 : 1}">
      <title>${esc(a.title)}</title></path>`);
    htmlParts.push(`<div class="node zoom-min" data-id="${esc(a.id)}" data-work="${esc(a.work)}" tabindex="0" role="button"
      style="left:${x}px; top:${y}px; width:${w}px; height:${h}px;" title="${esc(a.title)}"></div>`);
  }
  /* zoom "more" — ~5 units at once: title row only, no meta line / tool ticks. */
  function paintNodeSimple(a, x, y, w, h, pad, tight) {
    const sw = a.parent == null ? 2.6 : 1.5;
    svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}"
      fill="var(--surface)" stroke="none"/>`);
    svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}"
      fill="${cvar(a.type)}" fill-opacity="${a.parent == null ? 0.2 : 0.13}" stroke="${cvar(a.type)}" stroke-width="${sw}"/>`);
    htmlParts.push(`<div class="node tight" data-id="${esc(a.id)}" data-work="${esc(a.work)}" tabindex="0" role="button"
      style="left:${x}px; top:${y + pad}px; width:${w}px; height:${h - pad * 2}px; --nc:${cvar(a.type)};"
      title="${esc(a.title)}">
      <span class="t" title="${esc(a.title)}">${esc(a.title)}</span>
    </div>`);
  }
  function paintNodeFull(a, x, y, w, h, pad, tight) {
    /* main thread (parentless root) gets a heavier border so it reads as the
       session's spine among its uniformly-shaped children. */
    const sw = a.parent == null ? 2.6 : 1.5;
    svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}"
      fill="var(--surface)" stroke="none"/>`);
    svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}"
      fill="${cvar(a.type)}" fill-opacity="${a.parent == null ? 0.2 : 0.13}" stroke="${cvar(a.type)}" stroke-width="${sw}"
      ${a.status !== 'ok' ? 'stroke-dasharray="5 3"' : ''}/>`);
    if (a.status !== 'ok') {
      svgParts.push(`<path class="shape" data-id="${esc(a.id)}" d="${rectPath(x, y, w, h)}" fill="url(#hatch)" pointer-events="none"/>`);
    }
    /* exactly three rows: title, meta, tool-tick strip. Skill chips were a
       fourth (variable-count) row and are dropped — skills stay in the drawer. */
    htmlParts.push(`<div class="node${tight ? ' tight' : ''}" data-id="${esc(a.id)}" data-work="${esc(a.work)}" tabindex="0" role="button"
      style="left:${x}px; top:${y + pad}px; width:${w}px; height:${h - pad * 2}px; --nc:${cvar(a.type)};"
      title="${esc(a.title)}">
      <span class="t" title="${esc(a.title)}">${esc(a.title)}</span>
      ${metaLine(a)}
      ${toolChipRegion(a)}
    </div>`);
  }
  /* ROW 3: the tool-tick strip — one absolutely-positioned tick per tool call,
      spread left→right across the node's WIDTH by its position in the agent's
      own time span (frac of [t0,t1] * a.w). Returns '' when there are no events. */
  function toolChipRegion(a) {
    const ticks = toolTicks(a);
    if (!ticks.length) return '';
    const chips = ticks.map((k) => {
      if (k.overflow) return `<span class="tburst more" title="+${k.overflow} more tool calls" style="left:${k.off}px"></span>`;
      return `<span class="tburst cat-${k.cat}" title="${esc(k.title)}" style="left:${k.off}px"></span>`;
    }).join('');
    return `<div class="toolrow">${chips}</div>`;
  }
  
  /* orthogonal V–H–V elbow with rounded corners: vertical out of x1,y1, a single
     horizontal turn in the channel at yk, vertical into x2,y2. */
  function elbowV(x1, y1, x2, y2, yk, r) {
    const sIn = Math.sign(yk - y1) || 1;
    const sH = Math.sign(x2 - x1) || 1;
    const sOut = Math.sign(y2 - yk) || 1;
    const rr = Math.max(0, Math.min(r, Math.abs(x2 - x1) / 2, Math.abs(yk - y1), Math.abs(y2 - yk)));
    return `M${x1},${y1} V${yk - sIn * rr}`
      + ` Q${x1},${yk} ${x1 + sH * rr},${yk}`
      + ` H${x2 - sH * rr}`
      + ` Q${x2},${yk} ${x2},${yk + sOut * rr}`
      + ` V${y2}`;
  }

  /* ================================================================
     RANK-BASED COMPACT LAYOUT (horizontal: time flows left→right)

     The old layout positioned nodes PROPORTIONALLY to elapsed time along a
     global ruler (with hatched "idle" strips compressing gaps) and drew each
     agent kind as a different shape/size. This redesign drops all of that in
     favour of density:

       - Uniform node shape/size: every node is the same NODE_W-wide rounded
         rectangle (height grows only to fit wrapped text); kind is signalled by
         fill/border colour + labels (see paintNode/rectPath). Main thread gets a
         heavier border.
       - Within a session, nodes keep chronological ORDER but spacing is
         RANK-based, not time-proportional: a chronological pre-order DFS gives
         every node a sequential rank; position = rank, so children sit directly
         next to their parent and there are no time gaps to compress (the idle
         strips and the global ruler are gone). Durations still live in labels.
       - Each SESSION (a root + its whole subtree) lays out as one atomic block:
         rank→columns (time left→right), depth→rows.
       - Sessions are then BIN-PACKED (skyline, bottom-left, chronological order)
         into a roughly square board that hugs the top-left and wraps — instead
         of spreading down one global time axis. Each session band carries a
         local time reference (start time + duration) in its label.

     Invariants preserved: sessions atomic & non-intersecting (skyline places
     gapped, non-overlapping rectangles and every node lives inside its own
     session box), 0 node overlaps, content-driven height so no truncation,
     de-collided band labels, correct parent/dispatch/return/respawn edges. */

  const NODE_W    = 210;   // uniform minimum node width
  const NODE_MIN_H = 44;   // floor; grown to fit wrapped text post-paint
  const DEPTH_GAP = 26;    // gap along the depth axis (y)
  const RANK_GAP  = 12;    // gap along the rank axis (x)
  const BAND_PAD  = 12;    // padding inside a session band
  const BAND_LABEL_H = 22; // reserved strip at the band top for its label
  const SESS_GAP  = 30;    // gap between packed session blocks
  const DAY_H     = 34;    // height of a full-width day-divider strip
  let dayMarkers = [];     // [{y,label}] full-width date dividers along the flow

  const childrenMap = {};
  AGENTS.forEach((a) => { if (a.parent) (childrenMap[a.parent] ||= []).push(a.id); });

  /* one entry per session (root + subtree), nodes in chronological pre-order so
     rank == index and a parent is immediately followed by its first child.
     ALL_SESSIONS is the full, unfiltered list (used by the session-filter panel
     and to compute the default visible set); `sessions` (below, `let` not
     `const`) is the subset currently checked in that panel, and is what
     layoutInternal/packSessions/applyAbs/paint actually walk — hiding a
     session means it's simply never laid out or painted, not just visually
     dimmed. */
  const ALL_SESSIONS = ROOTS.slice().sort((p, q) => p.t0 - q.t0).map((r, i) => {
    const nodes = [];
    (function visit(id) {
      const a = byId[id];
      if (!a) return;
      a._rank = nodes.length;
      nodes.push(a);
      const kids = (childrenMap[id] || []).slice().sort((x, y) => byId[x].t0 - byId[y].t0);
      for (const k of kids) visit(k);
    })(r.id);
    return { root: r, idx: i + 1, nodes };
  });

  /* ============================================================
     Session selection + zoom-level state: sort/paginate model backing
     the selection panel (rendered further below). Rendering ALL sessions
     at once on a large aggregated graph (100+ sessions, 1000+ agents) is
     what makes the page laggy to paint/scroll/zoom — the DOM/SVG node
     count, not layout cost — so the default view still only shows a
     slice; the user pages/zooms into more. */

  /* per-session metrics, computed once, used by every sort key below */
  for (const s of ALL_SESSIONS) {
    s.duration = Math.max(0, s.root.t1 - s.root.t0);
    s.agentCount = s.nodes.length;
    s.loc = s.nodes.reduce((n, a) => n + (a.diff.added || 0) + (a.diff.removed || 0), 0);
    s.size = s.nodes.reduce((n, a) => n + (a.tokens.in || 0) + (a.tokens.out || 0)
      + (a.tokens.cacheRead || 0) + (a.tokens.cacheCreate || 0), 0);
  }

  const SORT_KEYS = {
    time:     { label: 'Time created',    get: (s) => s.root.t0 },
    size:     { label: 'Size (tokens)',   get: (s) => s.size },
    loc:      { label: 'LOC written',     get: (s) => s.loc },
    duration: { label: 'Time taken',      get: (s) => s.duration },
    agents:   { label: 'Agents used',     get: (s) => s.agentCount },
  };
  const ZOOM_LEVELS = ['regular', 'more', 'all']; // regular=1 unit/page, more=~5 units/page, all=everything

  let selSortKey = 'time';
  let selSortDir = 'desc';
  let selZoom = 'regular';
  let selPageSize = 10;   // user-configurable (5/10/20) — page size for non-time sorts
  let selPageIndex = 0;   // current page/day index within the sorted unit list

  const dayKeyOf = (t) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
  const dayLabelOf = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' });

  function getSortedSessions() {
    const key = SORT_KEYS[selSortKey] || SORT_KEYS.time;
    const arr = ALL_SESSIONS.slice().sort((a, b) => key.get(a) - key.get(b));
    if (selSortDir === 'desc') arr.reverse();
    return arr;
  }
  /* "units" are what a single page consists of: one calendar day's worth of
     sessions when sorting by time (so pagination reads as day-by-day), or a
     fixed-size chunk of `selPageSize` sessions for every other sort. Each
     entry is an array of sessions. */
  function getUnits() {
    const sorted = getSortedSessions();
    if (selSortKey === 'time') {
      const units = [];
      let curKey = null, curArr = null;
      for (const s of sorted) {
        const dk = dayKeyOf(s.root.t0);
        if (dk !== curKey) { curArr = []; units.push(curArr); curKey = dk; }
        curArr.push(s);
      }
      return units;
    }
    const units = [];
    for (let i = 0; i < sorted.length; i += selPageSize) units.push(sorted.slice(i, i + selPageSize));
    return units;
  }
  function unitsPerPage() { return selZoom === 'all' ? Infinity : selZoom === 'more' ? 5 : 1; }
  /* visual board scale for the current zoom level — independent of
     unitsPerPage()/pagination above: this actually shrinks the rendered
     board so more of it fits in the viewport at once. */
  function zoomScale() { return selZoom === 'all' ? 0.22 : selZoom === 'more' ? 0.55 : 1; }
  function pageCount() {
    const upp = unitsPerPage();
    const n = getUnits().length;
    return upp === Infinity ? 1 : Math.max(1, Math.ceil(n / upp));
  }
  function computeVisibleSessions() {
    const units = getUnits();
    if (!units.length) return [];
    const upp = unitsPerPage();
    if (upp === Infinity) return units.flat();
    const maxPage = Math.max(0, Math.ceil(units.length / upp) - 1);
    selPageIndex = Math.min(Math.max(0, selPageIndex), maxPage);
    const start = selPageIndex * upp;
    return units.slice(start, start + upp).flat();
  }

  let sessions = [];

  /* ---- per-session LOCAL TIME AXIS ----
     Within a session the FLOW axis (x) is a real time axis: a node's flow
     OFFSET = (t0 − sessionStart) and its flow EXTENT = runtime, both × a per-session
     scale — "as wide as it took to run". DEPTH maps to the CROSS axis (y); nodes at
     the same depth that OVERLAP IN TIME are pushed into parallel
     sub-lanes so concurrency is visible side-by-side. Every cross-neighbour (lane↔lane
     and depth↔depth) is separated by the SAME CROSS_GAP, so the strip just before any
     node on the cross axis is always an empty gutter — that is where the elbow edges
     route (0 node interiors crossed).

     SCALE: per-session px/min = clamp(TARGET_FLOW / sessionSpanMinutes, MIN, MAX).
     Normalising each session's whole span toward ~TARGET_FLOW keeps the board compact
     and stops one marathon session from dominating, while WITHIN a session offset and
     extent stay strictly proportional to time. Extents are floored (a node is never
     narrower than NODE_W, so labels stay legible) and capped at MAX_EXT so one very
     long node can't blow up a band. */
  const CROSS_GAP   = DEPTH_GAP;          // uniform separation between every cross-neighbour
  /* a generous time scale so nodes get enough width to lay their content out in
     rows instead of wrapping. */
  const TARGET_FLOW = 1120;               // aim each session's span ≈ this many px
  const MIN_PXPM = 0.25, MAX_PXPM = 20;   // per-session scale clamp (px per minute)
  const MAX_EXT = 900;                    // cap a single node's time extent
  const LANE_FLOW_GAP = 8;                // min flow-gap between two same-lane nodes
  const TOOL_RESERVE = 11;                // bottom strip reserved for the tool-tick row (== .toolrow height, no extra gap)
  /* labelled local time axis reserved inside each band as a top strip. Nodes are
     shifted off it so labels never collide. */
  const AXIS_H = 16;                      // top time-axis strip height
  /* The time axis is reserved on the CROSS axis (a TOP strip), so nodes never sit
     on it: cross = y: CROSS0 = BAND_PAD + label + AXIS_H; flow = x starts at BAND_PAD. */
  const CROSS0 = BAND_PAD + BAND_LABEL_H + AXIS_H;
  const FLOW_OFF = BAND_PAD;

  /* content height (a._contentH) is measured post-paint and fed back into the cross
     extent so text never truncates; start at the floor. */
  for (const a of AGENTS) { a.w = NODE_W; a.h = NODE_MIN_H; a._contentH = NODE_MIN_H; }

  const nodePad = (a) => a.parent == null ? 4 : (a.work === 'orchestration' ? 4 : 3);
  const durMin = (a) => Math.max(0, a.t1 - a.t0) / 60000;

  function layoutInternal() {
    for (const s of sessions) {
      const nodes = s.nodes;
      const sStart = Math.min(...nodes.map((a) => a.t0));
      const sEnd = Math.max(...nodes.map((a) => a.t1));
      const spanMin = Math.max(1, (sEnd - sStart) / 60000);
      const scale = Math.min(MAX_PXPM, Math.max(MIN_PXPM, TARGET_FLOW / spanMin));
      s.scale = scale; s.sStart = sStart; s.sEnd = sEnd;

      /* flow offset (∝ start) + flow extent (∝ runtime) + cross extent per node */
      for (const a of nodes) {
        a._flow = FLOW_OFF + ((a.t0 - sStart) / 60000) * scale;
        const durExt = Math.min(MAX_EXT, durMin(a) * scale);
        /* flow extent = duration width (≥ NODE_W); cross extent = content height
           (already includes the reserved tool strip via a._contentH). */
        a._fext = Math.max(NODE_W, durExt);
        a._cext = Math.max(NODE_MIN_H, a._contentH);
      }

      /* NESTED SUBTREE packing on the cross axis. Each node's WHOLE subtree occupies
         a CONTIGUOUS cross-range, so a coordinator's descendants read as one grouped
         sub-cluster instead of interleaving with sibling subtrees in a shared global
         depth lane. A node sits at the shallow edge of its subtree's cross-range; its
         children's subtrees are packed DEEPER (larger cross) into cross-lanes by TIME
         overlap — concurrent children get parallel lanes, each lane as wide as its
         widest member SUBTREE. Flow (time) positions are untouched, and every
         cross-neighbour is separated by CROSS_GAP so the elbow gutters stay clear. */
      const kids = {};
      for (const a of nodes) if (a.parent && byId[a.parent] && a.parent !== a.id) (kids[a.parent] ||= []).push(a);
      for (const k in kids) kids[k].sort((x, y) => x._flow - y._flow);

      const subFlowEnd = (n) => {
        let e = n._flow + n._fext;
        for (const c of (kids[n.id] || [])) e = Math.max(e, subFlowEnd(c));
        return (n._subFlowEnd = e);
      };
      const subWidth = (n) => {
        const ch = kids[n.id] || [];
        n._hasKids = ch.length > 0;
        if (!ch.length) { n._laneW = []; return (n._subW = n._cext); }
        const laneEnd = [], laneW = [];
        for (const c of ch) {
          const cw = subWidth(c);                                   // ensure c._subW / c._subFlowEnd
          let lane = laneEnd.findIndex((e) => e + LANE_FLOW_GAP <= c._flow);
          if (lane === -1) { lane = laneEnd.length; laneEnd.push(0); laneW.push(0); }
          laneEnd[lane] = c._subFlowEnd;
          laneW[lane] = Math.max(laneW[lane], cw);
          c._lane = lane;
        }
        n._laneW = laneW;
        const childBlock = laneW.reduce((sum, w) => sum + w + CROSS_GAP, 0);   // leading gap + lanes
        return (n._subW = n._cext + childBlock);
      };
      const place = (n, cs) => {
        n._cross = cs;
        const ch = kids[n.id] || [];
        if (!ch.length) return;
        const base = cs + n._cext;
        const laneOff = []; let run = CROSS_GAP;
        for (let i = 0; i < n._laneW.length; i++) { laneOff[i] = run; run += n._laneW[i] + CROSS_GAP; }
        for (const c of ch) place(c, base + laneOff[c._lane]);
      };
      const subBox = (n) => {
        let c0 = n._cross, c1 = n._cross + n._cext, f0 = n._flow, f1 = n._flow + n._fext;
        for (const c of (kids[n.id] || [])) { const b = subBox(c); c0 = Math.min(c0, b[0]); c1 = Math.max(c1, b[1]); f0 = Math.min(f0, b[2]); f1 = Math.max(f1, b[3]); }
        return (n._sb = [c0, c1, f0, f1]);
      };
      const rootNode = s.root;
      subFlowEnd(rootNode); subWidth(rootNode); place(rootNode, CROSS0); subBox(rootNode);
      /* fallback for any node not reached from the root (defensive; shouldn't happen) */
      for (const a of nodes) if (a._cross == null) { a._cross = CROSS0; a._hasKids = false; a._sb = [a._cross, a._cross + a._cext, a._flow, a._flow + a._fext]; }

      s.flowMax = Math.max(...nodes.map((a) => a._flow + a._fext)) + BAND_PAD;
      s.crossMax = Math.max(...nodes.map((a) => a._cross + a._cext)) + BAND_PAD;
      s.gw = s.flowMax; s.gh = s.crossMax;
    }
  }

  /* skyline bin-pack the session blocks (each padded by SESS_GAP) into a
     roughly square board, hugging the top-left and wrapping. Bottom-left
     heuristic → dense; chronological processing order keeps sessions roughly
     time-ordered left→right / top→bottom. Guarantees non-overlapping,
     gap-separated session boxes. */
  /* CHRONOLOGICAL shelf packing. The global time scale IS the reading order: session
     blocks flow strictly in start-time order top-left → right, wrapping to the next
     shelf-row when they exceed the board width — no session is ever placed out of
     chronological order (unlike a bottom-left skyline, which could tuck a later small
     block into an earlier gap). Where the flow crosses into a new calendar day it
     forces a row break and records a full-width day-divider (dayMarkers), giving an
     approximate global time scale without a separate timeline widget; per-session
     start-time + duration labels carry the finer (hour) resolution. Still compact and
     pack-driven; sessions stay atomic and gap-separated (SESS_GAP), so no two boxes
     intersect. */
  function packSessions() {
    dayMarkers = [];
    if (!sessions.length) { BOARD_W = BOARD_H = 40; return; }
    const totalArea = sessions.reduce((n, s) => n + (s.gw + SESS_GAP) * (s.gh + SESS_GAP), 0);
    const maxW = Math.max(...sessions.map((s) => s.gw + SESS_GAP));
    const W = Math.max(maxW, Math.round(Math.sqrt(totalArea) * 1.5));
    const dayKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
    const dayLabel = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
    let cx = 0, rowY = 0, rowH = 0, prevDay = null;
    for (const s of sessions) {
      const dk = dayKey(s.root.t0);
      if (dk !== prevDay) {
        if (cx > 0) rowY += rowH + SESS_GAP;          // close the current partial row
        else if (rowY > 0) rowY += SESS_GAP;
        dayMarkers.push({ y: rowY, label: dayLabel(s.root.t0) });
        rowY += DAY_H;
        cx = 0; rowH = 0; prevDay = dk;
      } else if (cx > 0 && cx + s.gw + SESS_GAP > W) { // wrap within the same day
        rowY += rowH + SESS_GAP; cx = 0; rowH = 0;
      }
      s.ox = cx; s.oy = rowY;
      cx += s.gw + SESS_GAP;
      rowH = Math.max(rowH, s.gh);
    }
    BOARD_W = Math.max(W, Math.max(...sessions.map((s) => s.ox + s.gw))) + 20;
    BOARD_H = rowY + rowH + 20;
  }

  function applyAbs() {
    for (const s of sessions) for (const a of s.nodes) {
      a.x0 = s.ox + a._flow;  a.w = a._fext;  a.y0 = s.oy + a._cross; a.h = a._cext;
    }
  }

  const DEFS = svgParts.join('');   // the <defs> block pushed above, reused each paint

  function paint() {
    svgParts.length = 0; svgParts.push(DEFS);
    htmlParts.length = 0;

    /* full-width day dividers along the reading flow (the global time scale) */
    for (const dm of dayMarkers) {
      svgParts.push(`<rect x="0" y="${dm.y}" width="${BOARD_W}" height="${DAY_H}" fill="var(--band)"/>
        <line x1="0" y1="${dm.y + DAY_H - 1}" x2="${BOARD_W}" y2="${dm.y + DAY_H - 1}" stroke="var(--grid)" stroke-width="1.5"/>`);
      htmlParts.push(`<div style="position:absolute; left:10px; top:${dm.y + 7}px; font-size:13px; font-weight:750; letter-spacing:0.04em; color:var(--ink-2); pointer-events:none;">${esc(dm.label)}</div>`);
    }

    /* session bands + local-time label (start time + total duration) */
    for (const s of sessions) {
      svgParts.push(`<rect x="${s.ox}" y="${s.oy}" width="${s.gw}" height="${s.gh}" rx="14"
        fill="var(--band)" stroke="var(--grid)" stroke-dasharray="3 4"/>`);
      /* LOCAL TIME AXIS: a labelled ruler in the reserved top strip with faint
         gridlines across the band, at a sensible interval for the per-session
         scale (≥ ~44px between labelled ticks). */
      const pxPerHour = s.scale * 60;
      const HR = 3600000;
      const tickHrs = Math.max(1, Math.ceil(44 / Math.max(1, pxPerHour)));   // hours between labelled ticks
      const stepMs = tickHrs * HR;
      /* axis baseline across the top strip (just above the nodes) */
      svgParts.push(`<line x1="${s.ox + FLOW_OFF}" y1="${s.oy + CROSS0 - 8}" x2="${s.ox + s.gw - 6}" y2="${s.oy + CROSS0 - 8}" stroke="var(--grid)" stroke-width="1" opacity="0.6"/>`);
      let ticks = 0;
      for (let t = Math.ceil(s.sStart / stepMs) * stepMs; t <= s.sEnd && ticks < 30; t += stepMs, ticks++) {
        const f = FLOW_OFF + ((t - s.sStart) / 60000) * s.scale;   // flow-axis coordinate of this tick
        svgParts.push(`<line x1="${s.ox + f}" y1="${s.oy + CROSS0 - 8}" x2="${s.ox + f}" y2="${s.oy + s.gh - 6}" stroke="var(--grid)" stroke-width="1" opacity="0.35"/>`);
        htmlParts.push(`<div class="axis-tick" style="left:${s.ox + f + 3}px; top:${s.oy + BAND_LABEL_H + 1}px;">${fmtT(t)}</div>`);
      }
      const r = s.root;
      const title = String(r.title || 'session').replace(/^Coordinator:\s*/i, '');
      const label = `${s.idx} · ${title}`;
      const tref = `${fmtT(r.t0)} · ${fmtDur(r.t1 - r.t0)}`;
      const lw = Math.max(60, s.gw - 20);
      htmlParts.push(`<div class="band-label" style="left:${s.ox + 10}px; top:${s.oy + 5}px; max-width:${lw}px; overflow:hidden; text-overflow:ellipsis;" title="${esc(label + ' · ' + tref)}">${esc(label)} · <span class="mono">${esc(tref)}</span></div>`);
    }

    /* subtree CONTAINMENT cues: a faint tinted, dashed, rounded rect behind each
       internal node's whole subtree bounding box (a._sb = [cross0,cross1,flow0,flow1]
       in local coords). Coordinators (depth 1) get a stronger tint; deeper nests get
       a fainter outline. Purely decorative — pointer-events:none, drawn behind edges
       and nodes — so a coordinator's descendants read as one contiguous sub-cluster. */
    for (const s of sessions) for (const a of s.nodes) {
      if (!a._hasKids || (a.depth || 0) < 1 || !a._sb) continue;
      const pad = 5 + Math.max(0, 2 - (a.depth - 1));   // slightly larger pad for shallower nests
      const [c0, c1, f0, f1] = a._sb;
      const x = s.ox + f0 - pad;
      const y = s.oy + c0 - pad;
      const w = (f1 - f0) + pad * 2;
      const h = (c1 - c0) + pad * 2;
      const coord = a.depth === 1;
      svgParts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" pointer-events="none"
        fill="${cvar(a.type)}" fill-opacity="${coord ? 0.05 : 0.03}"
        stroke="${cvar(a.type)}" stroke-opacity="${coord ? 0.4 : 0.28}" stroke-width="1" stroke-dasharray="${coord ? '2 4' : '1 4'}"/>`);
    }

    /* edges: dispatch (solid, arrow at child) + return (dotted, dot at child) +
       respawn (dashed muted). Rendered as orthogonal ELBOW polylines (right-angle
       segments with a small corner radius) rather than straight diagonals. In the
       rank-outline a child is always one depth deeper AND later in rank than its
       parent, so a facing-edge elbow is a clean L/Z: a V–H–V elbow off the parent's
       BOTTOM into the child's TOP, with the horizontal turn in the row-gap just
       above the child (keeps it out of node interiors). */
    /* only agents belonging to a currently-visible session get painted — this is
       the actual node/edge-count reduction that keeps the page responsive. */
    const visibleAgents = sessions.flatMap((s) => s.nodes);
    const visibleIdSet = new Set(visibleAgents.map((a) => a.id));
    const edges = [];
    const CR = 7;   // elbow corner radius
    const GUT = DEPTH_GAP / 2;   // half the empty gutter between adjacent depth bands
    for (const a of visibleAgents) {
      if (!a.parent) continue;
      const p = byId[a.parent];
      if (!p) continue;
      const acx = a.x0 + a.w / 2, acy = a.y0 + a.h / 2;
      const pcx = p.x0 + p.w / 2;
      /* A child is always exactly one depth-band deeper than its parent, so the
         strip between the parent's depth band and the child's is EMPTY of nodes.
         Route the elbow's long segment through that gutter (just before the child)
         so it never crosses a node interior: parent BOTTOM edge ⇢ child TOP edge,
         horizontal run in the y-gutter just above the child (V–H–V, via elbowV). */
      const yk = a.y0 - GUT;
      edges.push({ from: a.parent, to: a.id, d: elbowV(pcx, p.y0 + p.h, acx, a.y0, yk, CR),
        stroke: cvar(a.type), marker: `arr-${slug(a.type)}`, dash: '', op: 0.85, w: 2 });
      if (a.status === 'ok')
        edges.push({ from: a.id, to: a.parent, d: elbowV(acx + 7, a.y0, pcx + 7, p.y0 + p.h, yk + 5, CR),
          stroke: cvar(a.type), marker: `dot-${slug(a.type)}`, dash: '2.5 3.5', op: 0.55, w: 1.4, atStart: true });
      if (a.respawnOf && byId[a.respawnOf] && visibleIdSet.has(a.respawnOf)) {
        const dead = byId[a.respawnOf];
        const dcx = dead.x0 + dead.w / 2;
        const d = elbowV(dcx, dead.y0 + dead.h, acx, a.y0, (dead.y0 + dead.h + a.y0) / 2, CR);
        edges.push({ from: dead.id, to: a.id, d,
          stroke: 'var(--muted)', marker: 'arr-muted', dash: '4 4', op: 0.7, w: 1.4, respawn: true });
      }
    }
    pushEdges(edges, [8, -6]);

    /* every agent (root included) is a node; flow-axis extent ∝ runtime.
       Only nodes whose bbox intersects the scrolled viewport (+ generous
       overscan margin) actually get shape/text SVG emitted — this is the DOM
       node/text-composite reduction that keeps scroll/zoom smooth with 1000+
       agents selected. Edges and decorative bands above are cheap enough
       (far fewer elements, no per-node text) that they're left un-culled;
       culling them too risks an edge visually starting/ending from nowhere
       when its endpoint node is culled out. */
    const vpRect = getViewportRect();
    let culledCount = 0;
    for (const a of visibleAgents) {
      if (!nodeInRect(a, vpRect)) { culledCount++; continue; }
      const pad = nodePad(a);
      const tight = a.h < 70;
      paintNode(a, a.x0, a.y0, a.w, a.h, pad, tight);
    }

    const boardEl = document.getElementById('board');
    boardEl.innerHTML = `<svg width="${BOARD_W}" height="${BOARD_H}" viewBox="0 0 ${BOARD_W} ${BOARD_H}"
      role="img" aria-label="Agent graph">${svgParts.join('')}</svg>${htmlParts.join('')}`;
    /* the board is painted at full (logical) resolution and shrunk visually
       via a CSS transform, keyed off the zoom level (zoomScale()). The
       board's own layout box (its width/height style, which is what
       .board-scroll's scrollable area is based on — transforms don't affect
       ancestor scrollWidth/scrollHeight) is set to the SCALED size, so the
       scroll region matches what's visually rendered instead of leaving
       blank scrollable space past the shrunk content. */
    boardScale = zoomScale();
    boardEl.style.transform = `scale(${boardScale})`;
    boardEl.style.width = (BOARD_W * boardScale) + 'px';
    boardEl.style.height = (BOARD_H * boardScale) + 'px';
  }

  function relayoutAll() { layoutInternal(); packSessions(); applyAbs(); paint(); }
  relayoutAll();

  /* -------------------------------------------- viewport culling: repaint --- */
  /* Culling is recomputed on every scroll tick and on resize (the latter also
     covers native ctrl+scroll page zoom, which doesn't fire `scroll` on
     `.board-scroll` by itself but does rescale clientWidth/clientHeight of the
     whole page including the scroll container, so a `resize`/visualViewport
     listener is needed to re-cull after zooming, not just after scrolling).
     Both are rAF-coalesced: the scroll/resize handlers themselves only ever
     schedule a single repaint per animation frame, never call paint()
     synchronously, so rapid scroll/zoom doesn't stack up redundant repaints. */
  const boardScrollEl = document.querySelector('.board-scroll');
  let cullRepaintScheduled = false;
  function scheduleCullRepaint() {
    if (cullRepaintScheduled) return;
    cullRepaintScheduled = true;
    requestAnimationFrame(() => { cullRepaintScheduled = false; paint(); });
  }
  /* horizontal scroll happens on `.board-scroll` itself; vertical scroll is the
     page/window (see getViewportRect's comment above) — both need a listener. */
  if (boardScrollEl) boardScrollEl.addEventListener('scroll', scheduleCullRepaint, { passive: true });
  window.addEventListener('scroll', scheduleCullRepaint, { passive: true });
  window.addEventListener('resize', scheduleCullRepaint);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleCullRepaint);

  /* ============================================================
     Session selection / zoom control panel: sort, page/day scrubber,
     zoom-level segmented control.
     ============================================================ */

  /* sole write path: recompute `sessions` from the current
     sort/page/zoom state and repaint + re-render whichever panel is active. */
  function applySelection() {
    sessions = computeVisibleSessions();
    relayoutAll();
    renderSelectionPanel();
  }

  function sortOptionsHTML() {
    return Object.entries(SORT_KEYS).map(([k, v]) =>
      `<option value="${k}"${k === selSortKey ? ' selected' : ''}>${esc(v.label)}</option>`).join('');
  }
  function zoomSegHTML(idPrefix) {
    const labels = { regular: 'regular', more: 'more', all: 'all' };
    return `<span class="sel-seg" id="${idPrefix}Zoom">` + ZOOM_LEVELS.map((z) =>
      `<button type="button" data-zoom="${z}" class="${z === selZoom ? 'active' : ''}">${labels[z]}</button>`).join('') + `</span>`;
  }
  function shownCounts() {
    const totalAgents = ALL_SESSIONS.reduce((n, s) => n + s.nodes.length, 0);
    const shownAgents = sessions.reduce((n, s) => n + s.nodes.length, 0);
    return `${sessions.length}/${ALL_SESSIONS.length} sessions · ${shownAgents}/${totalAgents} agents shown`;
  }
  function unitLabel() {
    return selSortKey === 'time' ? 'day' : `${selPageSize}-session page`;
  }
  function pageLabel() {
    const units = getUnits();
    const upp = unitsPerPage();
    if (upp === Infinity) return `all ${units.length} ${unitLabel()}${units.length === 1 ? '' : 's'}`;
    const total = pageCount();
    if (selSortKey === 'time') {
      const start = selPageIndex * upp, end = Math.min(units.length, start + upp) - 1;
      const s0 = units[start] && units[start][0];
      const s1 = units[end] && units[end][0];
      if (!s0) return `page ${selPageIndex + 1}/${total}`;
      const lbl = s0 === s1 || !s1 ? dayLabelOf(s0.root.t0) : `${dayLabelOf(s0.root.t0)} – ${dayLabelOf(s1.root.t0)}`;
      return `${lbl}  (${selPageIndex + 1}/${total})`;
    }
    return `page ${selPageIndex + 1}/${total}`;
  }
  function wireSortDirZoomPage(root) {
    const sel = root.querySelector('[data-sel-sort]');
    if (sel) sel.addEventListener('change', () => { selSortKey = sel.value; selPageIndex = 0; applySelection(); });
    const dir = root.querySelector('[data-sel-dir]');
    if (dir) dir.addEventListener('click', () => { selSortDir = selSortDir === 'desc' ? 'asc' : 'desc'; selPageIndex = 0; applySelection(); });
    const sizeIn = root.querySelector('[data-sel-size]');
    if (sizeIn) sizeIn.addEventListener('change', () => {
      const v = parseInt(sizeIn.value, 10);
      selPageSize = [5, 10, 20].includes(v) ? v : 10;
      selPageIndex = 0; applySelection();
    });
    root.querySelectorAll('[data-zoom]').forEach((btn) => btn.addEventListener('click', () => {
      selZoom = btn.dataset.zoom; applySelection();
    }));
    const prev = root.querySelector('[data-sel-prev]');
    if (prev) prev.addEventListener('click', () => { selPageIndex--; applySelection(); });
    const next = root.querySelector('[data-sel-next]');
    if (next) next.addEventListener('click', () => { selPageIndex++; applySelection(); });
  }

  /* the one selection panel: bottom command-bar / palette — sort+zoom
     combined cluster, scrubber pager */
  function renderSelectionPanel() {
    const el = document.getElementById('selectionPanel');
    if (!el) return;
    const units = getUnits();
    const upp = unitsPerPage();
    const isTime = selSortKey === 'time';
    const ticks = units.map((u, i) => {
      const active = upp !== Infinity && i >= selPageIndex * upp && i < selPageIndex * upp + upp;
      const lbl = isTime ? dayLabelOf(u[0].root.t0) : `page ${i + 1}`;
      return `<button type="button" class="sc-tick${active ? ' active' : ''}" data-tick="${i}" title="${esc(lbl)}"></button>`;
    }).join('');
    el.innerHTML = `<div class="sel-box"><div class="sel-cluster">
      <select class="sel-select" data-sel-sort>${sortOptionsHTML()}</select>
      <button type="button" class="sel-dir" data-sel-dir title="toggle ascending/descending">${selSortDir === 'desc' ? '↓' : '↑'}</button>
      ${isTime ? '' : `<input class="sel-num" type="number" data-sel-size value="${selPageSize}" min="5" max="20" step="5" title="page size"/>`}
      <span class="sc-sep"></span>
      ${zoomSegHTML('sel')}
      <span class="sc-sep"></span>
      <button type="button" class="sel-btn" data-sel-prev>&larr;</button>
      <div class="sc-scrub">${ticks}</div>
      <button type="button" class="sel-btn" data-sel-next>&rarr;</button>
      <span class="sc-sep"></span>
      <span class="sel-count mono">${esc(pageLabel())} · ${esc(shownCounts())}</span>
    </div></div>`;
    el.querySelectorAll('[data-tick]').forEach((btn) => btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.tick, 10);
      const upp2 = unitsPerPage();
      selPageIndex = upp2 === Infinity ? 0 : Math.floor(i / upp2);
      applySelection();
    }));
    wireSortDirZoomPage(el);
  }

  /* initial default view: most recent day (time sort desc, page 0). This also
     supersedes the placeholder relayoutAll() call above (run with `sessions`
     still empty), doing the real first paint now that selection state exists. */
  applySelection();

  /* ------------------------------------------- content-driven size measurement --- */
  /* After each paint, measure every node's true content HEIGHT (a._contentH) and feed
     it back into the model, then re-run the whole layout + pack + paint so nothing
     overlaps and sessions stay atomic. The measurement is the bottom of the last FLOW
     child, EXCLUDING the absolutely-positioned tool strip (.toolrow) — measuring that
     would count the reserved strip and feed an infinite-growth loop. Nodes with tools
     reserve TOOL_RESERVE extra px at the bottom so the tick row no longer overlaps the
     last text line (the reported spill). */
  function measureNodes() {
    const board = document.getElementById('board');
    let changed = false;
    for (const el of board.querySelectorAll('.node[data-id]')) {
      const a = byId[el.dataset.id];
      if (!a) continue;
      const pad = nodePad(a);
      let cb = 0;
      for (const c of el.children) {
        if (c.classList.contains('toolrow')) continue;
        const b = c.offsetTop + c.offsetHeight;
        if (b > cb) cb = b;
      }
      /* the tick strip is a bottom row, so room must be reserved for it or row 3
         would paint over row 2. */
      const reserve = (a.events && a.events.length) ? TOOL_RESERVE : 0;
      const needH = cb + 1 + pad * 2 + reserve;
      if (Math.abs(needH - a._contentH) > 0.5) { a._contentH = needH; changed = true; }
    }
    return changed;
  }
  requestAnimationFrame(() => {
    let iter = 0;
    while (measureNodes() && iter++ < 6) relayoutAll();
  });
  
  /* ------------------------------------------------------- header/stats --- */
  
  document.getElementById('eyebrow').textContent = DATA.eyebrow || '';
  document.getElementById('title').textContent = DATA.title || (DATA.session && DATA.session.id) || 'Agent graph';
  document.getElementById('subtitle').innerHTML = DATA.subtitle || '';
  document.getElementById('footer').innerHTML = DATA.footer
    || 'Hover or click any node to light up its connections. Solid connectors are dispatches (parent → agent, at the moment of spawn); dotted connectors are results handed back on completion. Hatched blocks were killed mid-flight; dashed ⟳ links show which later agent picked their brief back up.';
  
  const sum = (k) => AGENTS.reduce((n, a) => n + (a.counts[k] || 0), 0);
  const sumStat = (grp, k) => AGENTS.reduce((n, a) => n + (a[grp][k] || 0), 0);
  const activeRuntime = workers.reduce((n, a) => n + (a.t1 - a.t0), 0);
  const totalTokens = sumStat('tokens', 'in') + sumStat('tokens', 'out')
    + sumStat('tokens', 'cacheRead') + sumStat('tokens', 'cacheCreate');
  const baseStats = [
    [String(AGENTS.length), 'agents'],
    [sum('edits'), 'file edits'],
    [sum('bash'), 'shell runs'],
    [`+${sumStat('diff', 'added')} −${sumStat('diff', 'removed')}`, 'lines changed'],
    [fmtTokens(totalTokens), 'tokens'],
    /* wall clock spans EVERY session's main thread, not just the primary
       root's — an aggregated graph has one root per session */
    [fmtDur(Math.max(...ROOTS.map((r) => r.t1)) - Math.min(...ROOTS.map((r) => r.t0))), 'wall clock'],
    [fmtDur(activeRuntime), 'worker runtime'],
  ];
  const extraStats = Array.isArray(DATA.extraStats) ? DATA.extraStats : [];
  /* accept either [value, label] pairs or {value/v, label/k/key} objects */
  const statPair = (s) => Array.isArray(s) ? s : [s.value ?? s.v ?? '', s.label ?? s.k ?? s.key ?? ''];
  document.getElementById('stats').innerHTML = [...baseStats, ...extraStats].map(statPair)
    .map(([v, k]) => `<div class="tile"><div class="v mono">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join('');
  
  /* nodes are now a uniform rectangle (shape no longer encodes work type), so the
     "Work type — shape" legend group is dropped; work type still shows in the drawer. */
  const hasFate = AGENTS.some((a) => a.status !== 'ok' || a.respawnOf);
  document.getElementById('legend').innerHTML = `
    <div class="grp"><span class="grp-label">Agent type — colour</span>
      ${typeOrder.map((t) => `<span class="item"><span class="swatch" style="background:${cvar(t)}"></span>${esc(t)}</span>`).join('')}
    </div>
    ${hasFate ? `<div class="grp"><span class="grp-label">Fate</span>
      <span class="item"><svg width="26" height="16"><rect x="1.5" y="1.5" width="23" height="13" rx="4" fill="url(#hatch)" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1.3"/></svg>killed mid-flight</span>
      <span class="item"><svg width="30" height="16"><path d="M2,8 H24" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M22,4.5 L27,8 L22,11.5 Z" fill="var(--muted)"/></svg>⟳ respawned as</span>
    </div>` : ''}`;
  
  /* ---------------------------------------------------------- interaction --- */
  
  const drawer = document.getElementById('drawer');
  const drawerBody = document.getElementById('drawerBody');
  const STATUS_TEXT = {
    ok: null,
    cutoff: 'Killed by the usage-limit window.',
    dropped: 'API connection closed mid-response.',
    fault: 'Harness fault — tool calls never executed.',
  };
  
  function openDrawer(id) {
    const a = byId[id];
    if (!a) return;
    const c = a.counts;
    const parent = a.parent ? byId[a.parent] : null;
    const sub = a.parent == null ? subtreeTotals(a.id) : null;
    drawerBody.innerHTML = `
      <div class="typechip" style="--dc:${cvar(a.type)}">${esc(a.type)} · ${esc(workLabel(a.work))}</div>
      <h2>${esc(a.title)}</h2>
      <div class="when mono">${fmtT(a.t0)} → ${fmtT(a.t1)} · ${fmtDur(a.t1 - a.t0)}${parent ? ` · dispatched by ${esc(parent.title || 'main thread')}` : ''}${a.model ? ` · ${esc(a.model)}` : ''}${a.branch ? ` · ⎇ ${esc(a.branch)}` : ''}</div>
      ${a.depth > 2 ? `<p class="status-note">Nested at depth ${a.depth} — shown in its nearest coordinator's worker column.</p>` : ''}
      ${a.parentGuessed ? `<p class="status-note">Parent inferred — the recorded spawn parent could not be resolved.</p>` : ''}
      ${STATUS_TEXT[a.status] ? `<p class="status-note"><b>${esc(STATUS_BADGE[a.status] || a.status)}</b> — ${STATUS_TEXT[a.status]}</p>` : ''}
      <h3>Brief</h3><p>${esc(a.brief)}</p>
      <h3>Outcome</h3><p>${esc(a.outcome)}</p>
      <h3>Skills loaded</h3>
      <p>${a.skills.length ? a.skills.map(esc).join(', ') : 'none recorded in the transcript'}</p>
      <h3>Tool calls</h3>
      <div class="counts"><span>${c.edits} edits</span><span>${c.bash} bash</span><span>${c.reads} reads</span>${c.spawns ? `<span>${c.spawns} agents spawned</span>` : ''}</div>
      ${eventsHtml(a)}
      <h3>Code changes</h3>
      ${diffLine(a.diff)}
      <h3>Tokens</h3>
      ${tokensLine(a.tokens)}
      ${a.parent == null ? `<h3>Session totals</h3>
        <div class="counts"><span>+${sub.diff.added} −${sub.diff.removed} lines · ${sub.diff.files} files</span></div>
        ${tokensLine(sub.tokens)}` : ''}`;
    drawer.classList.add('open');
  }

  /* drawer stat renderers */
  function diffLine(d) {
    if (!d.added && !d.removed && !d.files) {
      return '<div class="counts"><span>no file changes</span></div>';
    }
    return `<div class="counts"><span>+${d.added} −${d.removed} lines across ${d.files} files</span></div>`;
  }
  function tokensLine(tk) {
    const total = tk.in + tk.out + tk.cacheRead + tk.cacheCreate;
    return `<div class="counts"><span>${fmtTokens(tk.in)} input</span><span>${fmtTokens(tk.out)} output</span>`
      + `<span>${fmtTokens(tk.cacheRead)} cache read</span><span>${fmtTokens(tk.cacheCreate)} cache create</span>`
      + `<span>${fmtTokens(total)} total</span></div>`;
  }
  /* chronological timeline of the agent's OWN tool calls (not its children's) */
  function eventsHtml(a) {
    const evs = a.events;
    if (!evs || !evs.length) return '';
    const rows = evs.map((ev) => {
      const cat = evCat(ev.tool);
      const tgt = ev.target
        ? (ev.spawned
            ? `<span class="ev-target ev-spawn" data-goto="${esc(ev.spawned)}" title="open ${esc(ev.spawned)}">${esc(ev.target)}</span>`
            : `<span class="ev-target">${esc(ev.target)}</span>`)
        : '<span class="ev-target"></span>';
      let ln = '';
      if (ev.lines != null) {
        ln = ev.tool === 'Read'
          ? `<span class="ev-lines">${ev.lines} lines</span>`
          : `<span class="ev-lines">+${ev.lines}</span>`;
      }
      return `<div class="ev-row"><span class="ev-dot cat-${cat}"></span>`
        + `<span class="ev-time">${fmtT(T(ev.t))}</span>`
        + `<span class="ev-tool">${esc(ev.tool)}</span>`
        + tgt + ln + '</div>';
    }).join('');
    return `<div class="ev-timeline">${rows}</div>`;
  }

  /* element-wise diff+token sum over a root's entire subtree (main + descendants) */
  function subtreeTotals(rootId) {
    const kids = {};
    for (const a of AGENTS) (kids[a.parent] = kids[a.parent] || []).push(a.id);
    const diff = { added: 0, removed: 0, files: 0 };
    const tokens = { in: 0, out: 0, cacheRead: 0, cacheCreate: 0 };
    const stack = [rootId];
    const seen = new Set();
    while (stack.length) {
      const id = stack.pop();
      if (seen.has(id)) continue;
      seen.add(id);
      const a = byId[id];
      if (!a) continue;
      for (const k in diff) diff[k] += a.diff[k];
      for (const k in tokens) tokens[k] += a.tokens[k];
      for (const cid of (kids[id] || [])) stack.push(cid);
    }
    return { diff, tokens };
  }
  function openMarkerDrawer(idx) {
    const m = MARKERS[idx];
    if (!m) return;
    drawerBody.innerHTML = `
      <div class="typechip" style="--dc:var(--ink-2)">marker</div>
      <h2>${esc(m.label)}</h2>
      <div class="when mono">${fmtT(T(m.at))}</div>`;
    drawer.classList.add('open');
  }
  document.getElementById('drawerClose').addEventListener('click', () => drawer.classList.remove('open'));
  drawerBody.addEventListener('click', (e) => {
    const spawn = e.target.closest('.ev-spawn');
    if (spawn) {
      const id = spawn.dataset.goto;
      if (byId[id]) { openDrawer(id); isolate(id); }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') drawer.classList.remove('open'); });
  
  const board = document.getElementById('board');
  
  /* click-to-isolate: dim everything except the selected node's directed chain —
     walk UP through its parents to root, and DOWN through its own descendants
     only. Never flow back down into a parent's other children: if a coordinator
     spawns 4 subagents and one is selected, its 3 uninvolved siblings stay
     dimmed. Respawn partners (a real handoff relationship) stay linked. */
  const childrenOf = {};
  AGENTS.forEach((a) => { if (a.parent) (childrenOf[a.parent] ||= []).push(a.id); });
  function directedChain(id) {
    const seen = new Set([id]);
    let cur = byId[id];
    while (cur && cur.parent && !seen.has(cur.parent)) { seen.add(cur.parent); cur = byId[cur.parent]; }
    const stack = [id];
    while (stack.length) {
      const top = stack.pop();
      for (const cid of (childrenOf[top] || [])) {
        if (!seen.has(cid)) { seen.add(cid); stack.push(cid); }
      }
    }
    const sel = byId[id];
    if (sel && sel.respawnOf) seen.add(sel.respawnOf);
    AGENTS.forEach((a) => { if (a.respawnOf === id) seen.add(a.id); });
    return seen;
  }
  let isolated = null, hovered = null;
  /* Query the LIVE elements on every call — the board's innerHTML is rebuilt by the
     post-paint growth loop (relayoutAll), so any element list captured once goes
     stale/detached and toggling classes on it silently no-ops (this was the hover
     regression). Reading fresh from #board each time is cheap enough at this scale. */
  function focus(id) {
    const board = document.getElementById('board');
    const set = id ? directedChain(id) : null;
    board.querySelectorAll('.shape[data-id]').forEach((p) => p.classList.toggle('dim', !!set && !set.has(p.dataset.id)));
    board.querySelectorAll('.node[data-id]').forEach((p) => p.classList.toggle('dim', !!set && !set.has(p.dataset.id)));
    board.querySelectorAll('.edge').forEach((p) => {
      const inSet = !!set && set.has(p.dataset.from) && set.has(p.dataset.to);
      p.classList.toggle('dim', !!set && !inSet);
      p.classList.toggle('hot', inSet);
    });
  }
  function isolate(id) { isolated = id; focus(id); }
  /* hovering a node previews its connected component (edges lit) without a click;
     leaving reverts to whatever is click-isolated (if anything) */
  board.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-id]');
    const id = el ? el.dataset.id : null;
    if (id === hovered) return;
    hovered = id;
    focus(id || isolated);
  });
  board.addEventListener('mouseleave', () => { hovered = null; focus(isolated); });
  board.addEventListener('click', (e) => {
    const markerEl = e.target.closest('[data-marker]');
    if (markerEl) { openMarkerDrawer(+markerEl.dataset.marker); return; }
    const el = e.target.closest('[data-id]');
    if (el) {
      openDrawer(el.dataset.id);
      isolate(isolated === el.dataset.id ? null : el.dataset.id);
    } else {
      isolate(null);
    }
  });
  board.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.dataset.marker !== undefined) {
      e.preventDefault();
      openMarkerDrawer(+e.target.dataset.marker);
    } else if (e.target.dataset.id) {
      e.preventDefault();
      openDrawer(e.target.dataset.id);
      isolate(isolated === e.target.dataset.id ? null : e.target.dataset.id);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') isolate(null); });
  
}

// Wait for data to load, then initialize
let lastSessionCount = 0;
(async () => {
  if (DYNAMIC_MODE) {
    DATA = await loadDynamicSessions();
    lastSessionCount = (DATA.sessions || []).length;
  }
  await initializeGraph();

  // In dynamic mode, set up periodic refresh to detect new/deleted sessions
  if (DYNAMIC_MODE && SESSIONS_DIR) {
    setInterval(async () => {
      try {
        const indexResp = await fetch(`${SESSIONS_DIR}/index.json?t=${Date.now()}`);
        if (!indexResp.ok) return;
        const index = await indexResp.json();
        const newSessionCount = index.sessions.length;

        if (newSessionCount !== lastSessionCount) {
          console.log(`Session count changed: ${lastSessionCount} → ${newSessionCount}, refreshing...`);
          location.reload();
        }
      } catch (e) {
        console.debug('Refresh check failed:', e);
      }
    }, 5000);  // Check every 5 seconds
  }
})().catch(e => console.error('Init error:', e));
</script>
